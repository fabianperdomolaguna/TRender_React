[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pymongo>=4.18.2",
    "pyjwt>=2.10.1",
    "pwdlib[bcrypt]>=0.2.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
# pytest se ejecuta desde la carpeta `api` con `uv run pytest`
testpaths = ["tests"]
# permite importar `app.*` desde los tests sin instalar el paquete
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# los tests setean variables de entorno antes de importar la app
"tests/**" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
