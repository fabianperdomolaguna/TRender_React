name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    name: API tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version-file: api/.python-version
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest

  client-tests:
    name: Client tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Typecheck (tsc)
        run: pnpm exec tsc -b

      - name: Tests
        run: pnpm test
